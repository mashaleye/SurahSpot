# fly.toml app configuration file generated for surahspot on 2026-09-12T11:19:23-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'surahspot'
primary_region = 'lax'

[build]
[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine warm. auto_stop wipes the in-memory attempt store on every
  # idle, so a player returning mid-attempt loses their round and hint allowance.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    # Liveness only — never ?deep=1. The deep check calls Quran Foundation, so
    # an upstream blip would mark the machine unhealthy and restart it, turning
    # a degraded upstream into a total outage.
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
