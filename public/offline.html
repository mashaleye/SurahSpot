<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline — SurahSpot</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#f5f3ec">
<style>
  /*
   * Deliberately self-contained: this page is the last thing standing when
   * the network is gone, so it loads no fonts, scripts or stylesheets.
   */
  :root {
    --ink: #1f2622;
    --ink-2: #4e5852;
    --ink-3: #7f8983;
    --paper: #f5f3ec;
    --card: #fbfaf6;
    --line: #dcd9cf;
    --green: #1d7a56;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eef4f0;
      --ink-2: #bdc9c2;
      --ink-3: #87958d;
      --paper: #0d1210;
      --card: #131a16;
      --line: #2b3630;
      --green: #58c995;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--paper);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: min(420px, 100%);
    padding: 30px 26px;
    border-radius: 24px;
    background: var(--card);
    box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 12px 34px rgba(0,0,0,.07);
    text-align: center;
  }

  .eyebrow {
    margin: 0 0 10px;
    color: var(--green);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: .18em;
  }

  h1 {
    margin: 0 0 12px;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: -.04em;
    line-height: 1.1;
  }

  p {
    margin: 0 0 8px;
    color: var(--ink-2);
    font-size: 14px;
    line-height: 1.6;
  }

  .hint {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--ink-3);
    font-size: 12.5px;
  }

  button {
    margin-top: 18px;
    padding: 12px 22px;
    border: 0;
    border-radius: 999px;
    background: var(--green);
    color: #fff;
    font: inherit;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }

  button:active { transform: translateY(1px); }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">OFFLINE</p>
    <h1>No connection</h1>
    <p>Surahs you have already opened are still available to read. Anything new needs a connection.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <p class="hint">Your reading position, streak and My List are stored on this device and are safe.</p>
  </main>

  <script>
    // Reload by itself the moment the connection comes back, so nobody is
    // left looking at this page longer than they have to be.
    addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
